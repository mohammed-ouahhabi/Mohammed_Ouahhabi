<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Pilotage PDV{% endblock %}</title>
    <meta
      name="description"
      content="Plateforme décisionnelle de pilotage de la performance d'un point de vente."
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f8b6c'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a class="skip-link" href="#contenu-principal"
      >Aller au contenu principal</a
    >
    {% block layout %}
    <div class="app">
      {% include "partials/sidebar.html" %}
      <main class="content" id="contenu-principal">
        {% include "partials/flash.html" %} {% block content %}{% endblock %} {%
        include "partials/legal_footer.html" %}
      </main>
    </div>
    {% endblock %} {% include "partials/cookie_banner.html" %}

    <script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
