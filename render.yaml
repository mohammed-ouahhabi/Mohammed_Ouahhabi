# Déploiement sur Render (https://render.com) — infrastructure décrite en code.
# Crée automatiquement : 1 base PostgreSQL managée + 1 service web Flask.
#
# Au démarrage, le service :
#   1. installe les dépendances (buildCommand) ;
#   2. applique les migrations (flask db upgrade) ;
#   3. amorce le jeu de démo si la base est vide (scripts.bootstrap) ;
#   4. lance l'application avec gunicorn, en écoutant sur le port fourni par Render.
#
# La variable DATABASE_URL est injectée automatiquement depuis la base ci-dessous,
# ce qui bascule l'application de SQLite (dev) à PostgreSQL (prod) sans toucher au code.

databases:
  - name: pilotage-pdv-db
    databaseName: pilotage
    plan: free

services:
  - type: web
    name: pilotage-pdv
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # Migrations + amorçage + serveur. gunicorn doit écouter sur $PORT (Render).
    startCommand: "flask db upgrade && python -m scripts.bootstrap && gunicorn wsgi:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: FLASK_APP
        value: wsgi.py
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true          # Render génère une clé secrète forte
      - key: DATABASE_URL
        fromDatabase:
          name: pilotage-pdv-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
